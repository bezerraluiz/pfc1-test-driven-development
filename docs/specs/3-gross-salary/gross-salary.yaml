feature: gross-salary
description: Define os tipos de valor (records) do domínio da calculadora. GrossSalary encapsula e valida o salário bruto, garantindo que nunca circule um BigDecimal negativo ou zero como salário. CalculationResult agrega os quatro valores do resultado de um cálculo de salário líquido.

tdd_cycle: 3
package: com.pfc.tdd.calculator.domain
classes:
  - GrossSalary (record)
  - CalculationResult (record)

rules_gross_salary:
  - salário deve ser maior que zero (BigDecimal.compareTo(ZERO) > 0)
  - valor nulo lança NullPointerException (comportamento padrão do record)
  - construtor canônico valida o valor e lança IllegalArgumentException com mensagem clara se inválido
  - GrossSalary é imutável (record Java 16+)

rules_calculation_result:
  - é um agregador de resultado sem lógica própria — apenas carrega os quatro valores calculados
  - todos os campos são BigDecimal não nulos
  - net = gross − inss − irrf (invariante verificada externamente por SalaryNetCalculator)
  - CalculationResult é imutável (record Java 16+)

types:
  GrossSalary:
    fields:
      - name: value
        type: BigDecimal
        nullable: false
        constraint: "value > 0"
    throws:
      - exception: IllegalArgumentException
        trigger: value <= 0
        message: "Gross salary must be greater than zero"
    factory_notes: construtor canônico com validação; não usar static factory

  CalculationResult:
    fields:
      - name: gross
        type: BigDecimal
        nullable: false
        description: Salário bruto original
      - name: inss
        type: BigDecimal
        nullable: false
        description: Valor do INSS calculado
      - name: irrf
        type: BigDecimal
        nullable: false
        description: Valor do IRRF calculado
      - name: net
        type: BigDecimal
        nullable: false
        description: Salário líquido (gross − inss − irrf)

test_cases_gross_salary:
  - input: "3000.00"
    expected: GrossSalary criado com sucesso
  - input: "0.01"
    expected: GrossSalary criado com sucesso
  - input: "0.00"
    expected: throws IllegalArgumentException
  - input: "-100.00"
    expected: throws IllegalArgumentException

test_cases_calculation_result:
  - gross: "5000.00"
    inss: "509.60"
    irrf: "479.00"
    net: "4011.40"
    expected: CalculationResult criado com sucesso

design:
  - GrossSalary: record com um único campo `BigDecimal value`
  - CalculationResult: record with four BigDecimal fields (gross, inss, irrf, net)
  - ambos são records Java — sem boilerplate manual

assumptions:
  - inss e irrf não são encapsulados em wrappers próprios por não haver risco concreto de troca acidental neste contexto (YAGNI — conforme OC #3)
  - CalculationResult não calcula o líquido internamente — recebe os quatro valores já calculados
