feature: gross-salary
description: >
  Define dois tipos de valor imutáveis para o domínio financeiro:
  GrossSalary encapsula o salário bruto com validação (value > 0);
  CalculationResult agrega os quatro campos do resultado do cálculo (gross, inss, irrf, net) sem lógica de cálculo.

tdd_cycle: 3
package: com.pfc.tdd.calculator.domain
classes:
  - name: GrossSalary
    type: record (value object)
  - name: CalculationResult
    type: record (DTO)

rules:
  - GrossSalary.value deve ser estritamente maior que zero
  - GrossSalary lança IllegalArgumentException se value for zero ou negativo
  - CalculationResult é apenas um agregador — não realiza nenhum cálculo
  - ambos são imutáveis (record)
  - nunca usar double — apenas BigDecimal

input_GrossSalary:
  value:
    type: BigDecimal
    required: true
    nullable: false
    constraint: "value > 0"
    description: Valor do salário bruto em reais

output_GrossSalary:
  value:
    type: BigDecimal
    nullable: false
    description: Salário bruto validado e encapsulado

input_CalculationResult:
  gross:
    type: BigDecimal
    nullable: false
    description: Salário bruto original
  inss:
    type: BigDecimal
    nullable: false
    description: Contribuição INSS calculada
  irrf:
    type: BigDecimal
    nullable: false
    description: IRRF calculado
  net:
    type: BigDecimal
    nullable: false
    description: Salário líquido (bruto − inss − irrf)

errors:
  - code: ILLEGAL_ARGUMENT
    type: IllegalArgumentException
    trigger: GrossSalary instanciado com value <= 0
    message: "Gross salary must be greater than zero"

test_cases:
  - description: GrossSalary válido
    input: "5000.00"
    expected: GrossSalary com value = 5000.00
  - description: GrossSalary zero
    input: "0"
    expected: IllegalArgumentException
  - description: GrossSalary negativo
    input: "-100"
    expected: IllegalArgumentException
  - description: CalculationResult agrega corretamente
    input: {gross: "5000.00", inss: "509.60", irrf: "479.00", net: "4011.40"}
    expected: record com todos os campos acessíveis

design:
  - GrossSalary como record Java com compact constructor para validação
  - CalculationResult como record Java sem lógica (apenas campos)
  - nenhum setter — imutabilidade garantida pela natureza do record

assumptions:
  - a validação de formato (string → BigDecimal) é responsabilidade do InputParser, não do GrossSalary
  - GrossSalary recebe BigDecimal já parseado
