feature: tui-animator
description: Exibe um spinner Braille animado em uma thread de background enquanto o cálculo é processado. Pode ser iniciado e parado; ao parar, limpa a linha do terminal.

tdd_cycle: 7
package: com.pfc.tdd.calculator.tui
class: TuiAnimator
type: component

rules:
  - frames Braille em ordem: ⠋ ⠙ ⠹ ⠸ ⠼ ⠴ ⠦ ⠧ ⠇ ⠏
  - cada frame é exibido por 80ms antes do próximo
  - animação roda em thread separada — não bloqueia a thread principal
  - loop da thread usa Thread.currentThread().isInterrupted() como condição de saída
  - InterruptedException deve relançar o interrupt: Thread.currentThread().interrupt()
  - stop() interrompe a thread, aguarda join(200ms) e limpa a linha com "\033[2K\r"
  - exatamente 2 campos de instância: mensagem e saida (OC #8)
  - classe com no máximo 30 linhas (OC #7)
  - nunca usar System.out diretamente — sempre injetar PrintStream via construtor

constructor:
  params:
    - name: mensagem
      type: String
    - name: saida
      type: PrintStream

methods:
  - name: start
    description: inicia a thread de animação
  - name: stop
    description: interrompe a thread, aguarda join(200ms), limpa a linha, faz flush

test_approach:
  - injetar ByteArrayOutputStream como PrintStream
  - nunca usar System.out nos testes
  - verificar que stop() limpa a linha e encerra sem erro

design:
  - thread local (variável interna, não campo) para permitir múltiplos ciclos start/stop
  - usar interrupt() + join(200) para encerramento limpo
  - sem ExecutorService, sem AtomicBoolean como campo

assumptions:
  - start() sempre é chamado antes de stop()
  - terminal suporta carriage return (\r) para reposição do cursor
