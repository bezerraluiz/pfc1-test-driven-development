feature: tui-formatter
description: Formata um CalculationResult como um painel de caixa TUI com bordas Unicode e cores ANSI. Produz uma String multi-linha pronta para exibição no terminal. É a única classe que conhece formatação monetária e códigos ANSI.

tdd_cycle: 6
package: com.pfc.tdd.calculator.tui
class: TuiFormatter
type: utility

rules:
  - recebe CalculationResult e retorna String formatada com bordas Unicode e ANSI
  - usar ciano (\033[36m) para o cabeçalho
  - usar vermelho (\033[31m) para descontos (INSS, IRRF)
  - usar verde negrito (\033[1;32m) para o salário líquido
  - formato monetário: R$ X.XXX,XX (ponto para milhar, vírgula para decimal, 2 casas)
  - largura interna do painel: fixa em 38 caracteres
  - método format(CalculationResult) é o único método público

inputs:
  result:
    type: CalculationResult

outputs:
  panel:
    type: String

design:
  - implementar como classe stateless
  - método público: String format(CalculationResult result)
  - método privado: String formatCurrency(BigDecimal value) para DRY
  - usar StringBuilder ou Strings formatadas para compor as linhas
  - seguir OC #7: manter método format() conciso, extrair composição de linhas para métodos privados se necessário

assumptions:
  - formatação monetária é feita manualmente (ou via Locale pt-BR) para evitar dependência de locale do sistema
  - códigos ANSI são hardcoded por serem específicos do requisito de TUI
  - TestHelper.stripAnsi() deve ser usado em testes para permitir assert de conteúdo sem ser bloqueado por códigos ANSI
