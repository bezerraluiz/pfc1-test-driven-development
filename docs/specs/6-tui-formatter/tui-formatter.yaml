feature: tui-formatter
description: Formata um CalculationResult como painel TUI com bordas Unicode, cores ANSI e formatação monetária brasileira (ponto como separador de milhar, vírgula como separador decimal).

tdd_cycle: 6
package: com.pfc.tdd.calculator.tui
class: TuiFormatter
type: stateless-service

rules:
  - formatação monetária usa ponto como separador de milhar e vírgula como decimal (ex: R$ 5.000,00)
  - prefixo monetário sempre "R$ "
  - sempre 2 casas decimais nos valores monetários
  - cabeçalho "Resumo do Salário" em ciano (\033[36m)
  - linhas de desconto (INSS e IRRF) em vermelho (\033[31m)
  - linha de salário líquido em verde negrito (\033[1;32m)
  - largura interna do painel: 38 caracteres
  - bordas: ╭ ╮ ╰ ╯ │ ─ ├ ┤ ╡ ═
  - método privado formatCurrency deve ser a única implementação de formatação monetária (DRY)

input:
  result:
    type: CalculationResult
    required: true
    nullable: false
    description: Resultado do cálculo com gross, inss, irrf e net

output:
  panel:
    type: String
    nullable: false
    description: Painel multi-linha formatado com bordas Unicode e cores ANSI

layout:
  lines:
    - "╭──────────────────────────────────────╮"
    - "│  Resumo do Salário                   │   ← \033[36m ciano"
    - "├──────────────────────────────────────┤"
    - "│  Salário Bruto          R$ 5.000,00  │"
    - "├──────────────────────────────────────┤"
    - "│  (-) INSS                 R$ 501,51  │   ← \033[31m vermelho"
    - "│  (-) IRRF                 R$ 487,09  │   ← \033[31m vermelho"
    - "├══════════════════════════════════════╡"
    - "│  Salário Líquido        R$ 4.011,40  │   ← \033[1;32m verde negrito"
    - "╰──────────────────────────────────────╯"

design:
  - classe stateless — sem campos de instância
  - método público: String format(CalculationResult result)
  - método privado: String formatCurrency(BigDecimal value) — única implementação de formatação monetária (DRY)
  - usar NumberFormat ou String.format para formatação com Locale pt-BR

test_helper:
  class: TestHelper
  method: "static String stripAnsi(String text)"
  implementation: "text.replaceAll(\"\\\\033\\\\[[^m]*m\", \"\")"
  purpose: remover códigos ANSI para facilitar assertions nos testes

assumptions:
  - terminal com suporte a UTF-8 e ANSI; sem suporte, bordas e cores não renderizam corretamente
  - valores acima de R$ 99.999,99 podem desalinhar o painel (não suportado)
