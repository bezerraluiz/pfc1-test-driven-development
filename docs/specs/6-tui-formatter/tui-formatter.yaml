feature: tui-formatter
description: Formats a CalculationResult as a TUI box panel with Unicode borders and ANSI colors. Produces a multi-line String ready for display in the terminal. It is the only class that knows about monetary formatting and ANSI codes.

tdd_cycle: 6
package: com.pfc.tdd.calculator.tui
class: TuiFormatter
type: utility

rules:
  - receives CalculationResult and returns formatted String with Unicode borders and ANSI
  - use ciano (\033[36m) for the header
  - use red (\033[31m) for deductions (INSS, IRRF)
  - use bold green (\033[1;32m) for the net salary
  - currency format: R$ X.XXX,XX (dot for thousands, comma for decimals, 2 decimal places)
  - internal panel width: fixed at 38 characters
  - format(CalculationResult) method is the only public method

inputs:
  result:
    type: CalculationResult

outputs:
  panel:
    type: String

design:
  - implemented as a stateless class
  - public method: String format(CalculationResult result)
  - private method: String formatCurrency(BigDecimal value) for DRY
  - use StringBuilder or formatted Strings to compose the lines
  - follow OC #7: keep format() method concise, extract panel line composition to private methods if needed

assumptions:
  - currency formatting is manually implemented (or via Locale.forLanguageTag("pt-BR")) to avoid system locale dependency
  - ANSI codes are hardcoded as they are specific to the TUI requirement
  - TestHelper.stripAnsi() must be used in tests to allow asserting content without being blocked by ANSI codes
