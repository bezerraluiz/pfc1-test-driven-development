feature: input-parser
description: Faz o parse de uma String digitada pelo usuário em um GrossSalary. Lança InvalidInputException para entradas não numéricas, zero ou negativas, com mensagens amigáveis em português que são exibidas na TUI sem stack trace.

tdd_cycle: 5
package: com.pfc.tdd.calculator.tui
class: InputParser
type: utility

rules:
  - entrada válida retorna GrossSalary com o valor parseado
  - aceitar ponto e vírgula como separador decimal
  - entrada vazia ou em branco lança InvalidInputException
  - entrada não numérica lança InvalidInputException
  - entrada zero ou negativa lança InvalidInputException
  - o trim() da string deve ser feito externamente antes de chamar o parser

inputs:
  text:
    type: String
    required: true

outputs:
  grossSalary:
    type: GrossSalary

exceptions:
  InvalidInputException:
    type: unchecked
    messages:
      numeric_error: "Entrada inválida. Digite um número válido, como 3000 ou 3000,50."
      domain_error: "O salário deve ser maior que zero."

test_cases:
  - input: "3000"
    expected: GrossSalary(3000.00)
  - input: "3000.50"
    expected: GrossSalary(3000.50)
  - input: "3000,50"
    expected: GrossSalary(3000.50)
  - input: "abc"
    expected: throws InvalidInputException
  - input: "0"
    expected: throws InvalidInputException

design:
  - implementar como classe stateless
  - método público: GrossSalary parse(String text)
  - usar text.replace(",", ".") para normalização
  - capturar NumberFormatException e relançar como InvalidInputException
  - capturar IllegalArgumentException do construtor canônico de GrossSalary e relançar como InvalidInputException
  - seguir OC #2: usar early throw em vez de if-else
