feature: input-parser
description: Parses a String entered by the user into a GrossSalary. Throws InvalidInputException for non-numeric, zero, or negative inputs, with friendly Portuguese messages that are displayed in the TUI without a stack trace.

tdd_cycle: 5
package: com.pfc.tdd.calculator.tui
class: InputParser
type: utility

rules:
  - input string must be trimmed before calling parse
  - accept both dot (.) and comma (,) as decimal separators
  - empty or blank input throws InvalidInputException
  - non-numeric input throws InvalidInputException
  - zero or negative input throws InvalidInputException
  - valid input returns GrossSalary with the parsed value

inputs:
  text:
    type: String
    required: true

outputs:
  grossSalary:
    type: GrossSalary

exceptions:
  InvalidInputException:
    type: unchecked
    messages:
      numeric_error: "Entrada inválida. Digite um número válido, como 3000 ou 3000,50."
      domain_error: "O salário deve ser maior que zero."

test_cases:
  - input: "3000"
    expected: GrossSalary(3000.00)
  - input: "3000.50"
    expected: GrossSalary(3000.50)
  - input: "3000,50"
    expected: GrossSalary(3000.50)
  - input: "abc"
    expected: throws InvalidInputException
  - input: "0"
    expected: throws InvalidInputException

design:
  - implemented as a stateless class
  - public method: GrossSalary parse(String text)
  - use text.replace(",", ".") for normalization
  - catch NumberFormatException and rethrow as InvalidInputException
  - catch IllegalArgumentException from GrossSalary canonical constructor and rethrow as InvalidInputException
  - follow OC #2: use early throw instead of if-else
