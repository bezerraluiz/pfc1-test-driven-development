feature: tabela-inss
description: Calcula a contribuição progressiva do INSS a partir do salário bruto, aplicando as alíquotas por faixa conforme a Portaria Interministerial MPS/MF nº 13, de 9 de janeiro de 2026. Retorna o valor total do INSS arredondado para 2 casas decimais (HALF_EVEN).

tdd_cycle: 1
package: com.pfc.tdd.calculator.domain
class: InssTable
type: stateless-service

rules:
  - o cálculo é progressivo: cada faixa salarial tem sua alíquota própria aplicada sobre o valor dentro daquela faixa
  - a soma das parcelas por faixa é feita sem arredondamento intermediário
  - arredondamento HALF_EVEN com escala 2 é aplicado apenas ao total final
  - salário acima do teto (R$ 8.475,55) usa o teto como limite máximo da última faixa
  - salário de até R$ 1.621,00 gera INSS apenas na primeira faixa
  - zero ou negativo não são responsabilidade desta classe — validação delegada a GrossSalary

inss_table_2026:
  source: Portaria Interministerial MPS/MF nº 13, de 9 de janeiro de 2026
  brackets:
    - faixa: 1
      limite_superior: "1621.00"
      aliquota: "0.075"
    - faixa: 2
      limite_superior: "2902.84"
      aliquota: "0.09"
    - faixa: 3
      limite_superior: "4354.27"
      aliquota: "0.12"
    - faixa: 4
      limite_superior: "8475.55"
      aliquota: "0.14"

input:
  grossSalary:
    type: BigDecimal
    required: true
    nullable: false
    min: "0.01"
    description: Salário bruto em reais; deve ser positivo e já validado por GrossSalary

output:
  inss:
    type: BigDecimal
    scale: 2
    rounding: HALF_EVEN
    nullable: false
    description: Valor total do INSS calculado progressivamente

test_cases:
  - input: "1500.00"
    expected_inss: "112.50"
    note: apenas faixa 1 (1500 × 7,5%)
  - input: "1621.00"
    expected_inss: "121.58"
    note: teto exato da faixa 1
  - input: "3000.00"
    expected_inss: "248.60"
    note: faixas 1+2+parcial 3
  - input: "5000.00"
    expected_inss: "501.51"
    note: faixas 1+2+3+parcial 4
  - input: "8475.55"
    expected_inss: "988.09"
    note: teto máximo — faixas 1+2+3+4 completas

design:
  - implementar como classe sem campos de instância (stateless) — tabela como constante estática final
  - usar BigDecimal em todos os cálculos — nenhum double
  - extrair tabela como constante estática (List ou array de records de faixa)
  - método público: BigDecimal calculate(BigDecimal grossSalary)
  - método privado sugerido: BigDecimal calculateInstallment(BigDecimal grossSalary, BigDecimal lowerLimit, BigDecimal upperLimit, BigDecimal aliquot)

assumptions:
  - os valores da tabela INSS 2026 seguem a Portaria Interministerial MPS/MF nº 13 — confirmar na publicação oficial
  - salário maior que o teto tem INSS calculado somente até R$ 8.475,55; o excedente não é tributado
