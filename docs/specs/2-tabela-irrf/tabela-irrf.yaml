feature: tabela-irrf
description: Calcula o IRRF (Imposto de Renda Retido na Fonte) a partir da base de cálculo tributável (salário bruto menos INSS), usando a tabela progressiva mensal de maio/2025. Retorna o valor arredondado para 2 casas decimais (HALF_UP); nunca retorna valor negativo.

tdd_cycle: 2
package: com.pfc.tdd.calculator.domain
class: IrrfTable
type: stateless-service

rules:
  - a base de cálculo é o salário bruto menos o INSS já calculado — nunca o bruto direto
  - para base até R$ 2.428,80, o IRRF é R$ 0,00 (faixa de isenção)
  - para as demais faixas: irrf = base × aliquota − parcelaDedutivel
  - o resultado nunca pode ser negativo — aplicar max(irrf, ZERO)
  - arredondamento HALF_UP com escala 2 aplicado ao total final
  - zero ou negativo na base não são responsabilidade desta classe

irrf_table_2025:
  source: Tabela IRRF 05/2025
  brackets:
    - faixa: 1
      limite_superior: "2428.80"
      aliquota: "0.00"
      parcela_dedutivel: "0.00"
    - faixa: 2
      limite_superior: "2826.65"
      aliquota: "0.075"
      parcela_dedutivel: "182.16"
    - faixa: 3
      limite_superior: "3751.05"
      aliquota: "0.15"
      parcela_dedutivel: "394.16"
    - faixa: 4
      limite_superior: "4664.68"
      aliquota: "0.225"
      parcela_dedutivel: "675.49"
    - faixa: 5
      limite_superior: null
      aliquota: "0.275"
      parcela_dedutivel: "908.73"

input:
  taxableBase:
    type: BigDecimal
    required: true
    nullable: false
    description: Base de cálculo tributável (salário bruto − INSS); deve ser positivo

output:
  irrf:
    type: BigDecimal
    scale: 2
    rounding: HALF_UP
    min: "0.00"
    nullable: false
    description: Valor do IRRF calculado; nunca negativo

test_cases:
  - input: "1500.00"
    expected_irrf: "0.00"
    note: abaixo da faixa de isenção
  - input: "2428.80"
    expected_irrf: "0.00"
    note: limite exato da isenção
  - input: "3500.00"
    expected_irrf: "130.84"
    note: "faixa 3: 3500 × 15% − 394,16"
  - input: "4490.40"
    expected_irrf: "334.85"
    note: "faixa 4: 4490,40 × 22,5% − 675,49"

design:
  - implementar como classe sem campos de instância (stateless) — tabela como constante estática
  - usar BigDecimal em todos os cálculos — nenhum double
  - método público: BigDecimal calculate(BigDecimal taxableBase)
  - aplicar max(irrf, ZERO) antes do arredondamento para garantir não-negativo

assumptions:
  - a tabela IRRF de 05/2025 é a vigente; atualizações exigem alteração nesta classe
  - a base de cálculo já vem descontada do INSS — esta classe não faz o desconto
