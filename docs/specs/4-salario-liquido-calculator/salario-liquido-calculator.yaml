feature: salary-net-calculator
description: Orchestrates the net salary calculation from a GrossSalary, delegating to InssTable and IrrfTable, and returning a CalculationResult with the four values. It is the entry point for the calculator's business logic.

tdd_cycle: 4
package: com.pfc.tdd.calculator.domain
class: SalaryNetCalculator
type: service

rules:
  - receives GrossSalary (already validated) — does not revalidate the salary value
  - calculates INSS by calling InssTable.calculate(grossSalary.value())
  - calculates the IRRF base: taxableBase = grossSalary.value() − inss
  - calculates IRRF by calling IrrfTable.calculate(taxableBase)
  - calculates net salary: net = grossSalary.value() − inss − irrf
  - returns CalculationResult with the four values

inputs:
  grossSalary:
    type: GrossSalary
    required: true
    nullable: false

outputs:
  calculationResult:
    type: CalculationResult
    fields:
      gross: value from grossSalary.value()
      inss: value from InssTable.calculate()
      irrf: value from IrrfTable.calculate()
      net: result of gross − inss − irrf

design:
  - implemented with Dependency Injection (constructor)
  - dependencies: InssTable, IrrfTable
  - public method: CalculationResult calculate(GrossSalary grossSalary)
  - follow OC #5: name all intermediate results (inss, taxableBase, irrf, net)
  - follow OC #8: exactly 2 instance fields (inssTable, irrfTable)

assumptions:
  - TabelaInss and TabelaIrrf are stateless and can be instantiated as real objects in tests
  - No mocks used in this cycle's tests — integration testing between domain components
