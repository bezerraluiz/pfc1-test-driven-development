feature: salario-liquido-calculator
description: Orquestra o cálculo completo do salário líquido. Recebe um GrossSalary, delega o cálculo de INSS para InssTable e o de IRRF para IrrfTable (sobre a base tributável), e retorna um CalculationResult com todos os valores.

tdd_cycle: 4
package: com.pfc.tdd.calculator.domain
class: SalaryNetCalculator
type: service

rules:
  - inss é calculado sobre o salário bruto via InssTable
  - base tributável do IRRF é sempre (bruto − inss) — nunca o bruto direto
  - irrf é calculado sobre a base tributável via IrrfTable
  - salário líquido é (bruto − inss − irrf)
  - exatamente 2 campos de instância: inssTable e irrfTable (OC #8)
  - método calculate deve ter no máximo 7 linhas (OC #7)

constructor:
  params:
    - name: inssTable
      type: InssTable
    - name: irrfTable
      type: IrrfTable

input:
  grossSalary:
    type: GrossSalary
    required: true
    nullable: false
    description: Salário bruto encapsulado e validado

output:
  result:
    type: CalculationResult
    nullable: false
    fields:
      - gross: BigDecimal (grossSalary.value())
      - inss: BigDecimal (calculado por InssTable)
      - irrf: BigDecimal (calculado por IrrfTable sobre base tributável)
      - net: BigDecimal (gross − inss − irrf)

test_cases:
  - input: "1500.00"
    expected_inss: "112.50"
    expected_irrf: "0.00"
    expected_net: "1387.50"
    note: abaixo da isenção IRRF
  - input: "5000.00"
    expected_inss: "501.51"
    expected_irrf: "487.09"
    expected_net: "4011.40"
    note: referência principal

design:
  - receber dependências via construtor (sem DI automática do Spring)
  - método: CalculationResult calculate(GrossSalary grossSalary)
  - fluxo: inss → taxableBase → irrf → net → return CalculationResult(...)
  - sem mocks em testes — usar instâncias reais de InssTable e IrrfTable

assumptions:
  - InssTable e IrrfTable são stateless e podem ser reutilizadas sem estado compartilhado
  - GrossSalary já foi validado antes de chegar a este método
