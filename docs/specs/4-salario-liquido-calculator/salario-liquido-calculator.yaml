feature: salary-net-calculator
description: Orquestra o cálculo do salário líquido a partir de um GrossSalary, delegando para InssTable e IrrfTable, e retornando um CalculationResult com os quatro valores. É o ponto de entrada da lógica de negócio da calculadora.

tdd_cycle: 4
package: com.pfc.tdd.calculator.domain
class: SalaryNetCalculator
type: service

rules:
  - recebe GrossSalary (já validado) — não revalida o valor do salário
  - calcula INSS chamando InssTable.calculate(grossSalary.value())
  - calcula a base do IRRF: taxableBase = grossSalary.value() − inss
  - calcula IRRF chamando IrrfTable.calculate(taxableBase)
  - calcula salário líquido: net = grossSalary.value() − inss − irrf
  - retorna CalculationResult com os quatro valores

inputs:
  grossSalary:
    type: GrossSalary
    required: true
    nullable: false

outputs:
  calculationResult:
    type: CalculationResult
    fields:
      gross: valor de grossSalary.value()
      inss: valor de InssTable.calculate()
      irrf: valor de IrrfTable.calculate()
      net: resultado de gross − inss − irrf

design:
  - implementar com injeção de dependência via construtor
  - dependências: InssTable, IrrfTable
  - método público: CalculationResult calculate(GrossSalary grossSalary)
  - seguir OC #5: nomear todos os resultados intermediários (inss, taxableBase, irrf, net)
  - seguir OC #8: exatamente 2 campos de instância (inssTable, irrfTable)

assumptions:
  - InssTable e IrrfTable são stateless e podem ser instanciados como objetos reais em testes
  - Sem uso de mocks nos testes deste ciclo — teste de integração entre componentes do domínio
