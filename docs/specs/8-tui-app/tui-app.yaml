feature: tui-app
description: Orquestra o fluxo completo da TUI interativa. Exibe um banner, solicita o salário em loop com tratamento de erros, exibe spinner durante o cálculo (apenas quando output == System.out) e mostra o painel de resultado. Encerra após o primeiro cálculo bem-sucedido.

tdd_cycle: 8
package: com.pfc.tdd.calculator.tui
class: TuiApp
type: orchestrator

rules:
  - exibir banner antes do loop principal
  - loop continua enquanto não houver um cálculo bem-sucedido
  - ao capturar InvalidInputException, exibir a mensagem e continuar (continue — OC #2)
  - spinner é exibido apenas quando output == System.out (não em testes)
  - método execute() ≤ 20 linhas (OC #7)
  - exatamente 2 campos de instância: calculator e parser (OC #8)
  - métodos privados extraídos: displayBanner(output) e calculateWithAnimation(grossSalary, output)
  - encerrar após o primeiro cálculo bem-sucedido (break)
  - nunca exibir stack trace ao usuário

constructor:
  params:
    - name: calculator
      type: SalaryNetCalculator
    - name: parser
      type: InputParser

method_execute:
  signature: "void execute(Scanner scanner, PrintStream output)"
  flow:
    - displayBanner(output)
    - while (true):
      - ler linha do scanner e trim
      - tentar parser.parse(input)
      - se InvalidInputException: output.println(e.getMessage()); continue
      - se output == System.out: calculateWithAnimation(grossSalary, output)
      - senão: calcular diretamente
      - output.println(new TuiFormatter().format(result))
      - break

banner:
  content: |
    ╭──────────────────────────────────────╮
    │   Calculadora de Salário Líquido     │
    │             2026                     │
    ╰──────────────────────────────────────╯

test_cases:
  - input: "3000\n"
    expected_contains: "Salário Líquido"
  - input: "abc\n3000\n"
    expected_contains: ["mensagem de erro", "Salário Líquido"]
  - input: "-100\n3000\n"
    expected_contains: ["maior que zero", "Salário Líquido"]
  - input: "3000\n"
    expected_not_contains: ["Exception", "at com."]

design:
  - sem @Component Spring — instanciação manual em TddApplication
  - output != System.out em testes — sem animação
  - TuiFormatter instanciada dentro de execute() (sem campo)
  - TuiAnimator instanciada dentro de calculateWithAnimation()

tdd_application_update:
  description: modificar TddApplication para implementar CommandLineRunner e delegar ao TuiApp
  code: |
    @SpringBootApplication
    public class TddApplication implements CommandLineRunner {
        public static void main(String[] args) {
            SpringApplication.run(TddApplication.class, args);
        }
        @Override
        public void run(String... args) {
            var calculator = new SalaryNetCalculator(new InssTable(), new IrrfTable());
            new TuiApp(calculator, new InputParser()).execute(new Scanner(System.in), System.out);
        }
    }

assumptions:
  - Scanner é criado externamente e passado via execute() para facilitar testes
  - TuiFormatter não tem estado — pode ser instanciada a cada chamada
